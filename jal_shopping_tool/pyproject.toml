[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jal-shopping-tool"
version = "1.0.0"
description = "JALマイレージパーク LSP獲得を考慮したネットショッピング価格比較ツール"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]

[project.scripts]
jal-shop = "jal_shopping_tool.cli:main"
jal-shop-web = "jal_shopping_tool.app:main"
