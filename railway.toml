[build]
builder = "dockerfile"

[deploy]
startCommand = "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 300 --access-logfile - --error-logfile -"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
